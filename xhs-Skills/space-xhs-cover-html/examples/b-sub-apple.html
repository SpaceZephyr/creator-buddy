<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>示例 B · Apple 风格 · 大字+副标题</title>
<style>
/* ══════════════════════════════════════════════════════════════════
   ① 风格 TOKEN —— 唯一需要改的地方
   来源：品牌 DESIGN.md（getdesign）→ 按 references/cover-html-guide.md
   的「放大映射」规则换算；或直接粘贴 references/style-presets.md 里的现成块。
   ══════════════════════════════════════════════════════════════════ */
:root{
  /* — 颜色 — */
  --canvas:      #F5F5F7;   /* 画布底色 */
  --canvas-2:    #F5F5F7;   /* 渐变第二色；不要渐变就写成和 --canvas 相同 */
  --ink:         #1D1D1F;   /* 主标题 */
  --ink-2:       #4A4A4F;   /* 副标题 / 目录条目 */
  --ink-3:       #86868B;   /* 序号 / 角标 / 账号名 */
  --accent:      #0058B8;   /* 强调色，全图只用 1 处（品牌原色太浅时加深到 ≥4.5:1） */
  --on-accent:   #FFFFFF;   /* 强调块上的字色 */
  --hairline:    rgba(0,0,0,.08);  /* 分隔线 */

  /* — 字体 — */
  --font:        "PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif;
  --font-display:"PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif;
  /* 粗黑冲击力可用 "华文琥珀"；衬线气质用 "Songti SC","Noto Serif SC" */

  /* — 字号阶梯（下限：任何要在信息流里被读到的字 ≥ 90px 仅限主标题；
       目录/副标题在详情页与缩略图之间取舍，见 SKILL.md 二） — */
  --t1:  150px;  /* 主标题 100–150 */
  --t2:   64px;  /* 副标题 56–72 */
  --t3:   56px;  /* 目录条目 48–60 */
  --t4:   42px;  /* 标签 / 角标 / 账号名 36–48 */

  /* — 排版气质（从品牌规范抄比例，不抄绝对值） — */
  --title-weight: 700;
  --title-tracking: -0.03em;
  --title-leading: 1.08;
  --radius: 16px;      /* 品牌圆角气质：Linear/Vercel 用 8–12px，Airbnb/Notion 用 999px */
  --rhythm: 56px;       /* 垂直节奏基本单位 */

  /* — 安全区（1080×1440 基准，勿调小） — */
  --safe-x: 80px; --safe-top: 100px; --safe-bottom: 200px;
}

/* ══════════════════════════════════════════════════════════════════
   ② 骨架 —— flex 纵向流式，绝不用绝对定位堆内容
   （旧模板把 .handle 绝对定位在底部，.stage 内容一变高就重叠；
     这里 body 是 flex column，handle 是最后一个流式子元素，永不重叠）
   ══════════════════════════════════════════════════════════════════ */
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1080px;height:1440px;}
body{
  font-family:var(--font);
  color:var(--ink);
  background:linear-gradient(165deg,var(--canvas) 0%,var(--canvas-2) 100%);
  padding:var(--safe-top) var(--safe-x) var(--safe-bottom);
  display:flex;flex-direction:column;
  overflow:hidden;position:relative;
  -webkit-font-smoothing:antialiased;
}

.badge{                       /* 顶部角标：账号 / 栏目识别锤 */
  flex:none;
  font-size:var(--t4);font-weight:700;letter-spacing:.08em;color:var(--accent);
}
.stage{                       /* 主内容区：吃掉全部剩余高度 */
  flex:1 1 auto;min-height:0;
  display:flex;flex-direction:column;
  justify-content:safe center;  /* safe：内容超高时从顶部开始，绝不往上溢出压住 .badge */
  overflow:hidden;              /* 超高时裁切而不是压穿 .handle —— 裁切会被渲染脚本报警 */
  gap:var(--rhythm);
  padding:var(--rhythm) 0;
}
.handle{                      /* 账号名：流式，跟在 stage 后面，不会被压 */
  flex:none;
  font-size:var(--t4);color:var(--ink-3);letter-spacing:.06em;
}
.rail{                        /* 可选：左侧竖色带识别锤 */
  position:absolute;left:0;top:0;bottom:0;width:20px;background:var(--accent);
}

/* ══════════════════════════════════════════════════════════════════
   ③ 文字组件
   ══════════════════════════════════════════════════════════════════ */
.title{
  font-family:var(--font-display);
  font-size:var(--t1);font-weight:var(--title-weight);
  line-height:var(--title-leading);letter-spacing:var(--title-tracking);
  text-wrap:balance;
}
.title em{font-style:normal;color:var(--accent);}          /* 强调词，只给 1 处 */
.title mark{                                                /* 荧光笔式强调（二选一） */
  background:linear-gradient(transparent 56%,var(--accent) 56%);
  color:inherit;padding:0 6px;
}
.sub{
  font-size:var(--t2);line-height:1.45;font-weight:600;color:var(--ink-2);
  text-wrap:balance;
}
.tag{
  align-self:flex-start;
  font-size:var(--t4);font-weight:700;
  background:var(--accent);color:var(--on-accent);
  padding:16px 32px;border-radius:var(--radius);
}
.tag.ghost{background:transparent;color:var(--accent);border:3px solid var(--accent);}

/* ══════════════════════════════════════════════════════════════════
   ④ 内容形态 A：大字 + 短目录  <body data-layout="toc">
       toc 变体用 data-toc="num|line|card|dot" 切换
   ══════════════════════════════════════════════════════════════════ */
.toc{list-style:none;display:flex;flex-direction:column;gap:20px;}
.toc li{
  font-size:var(--t3);font-weight:600;line-height:1.3;color:var(--ink-2);
  display:flex;align-items:baseline;gap:24px;
}
[data-toc="num"] .toc{counter-reset:i;}
[data-toc="num"] .toc li::before{
  counter-increment:i;content:counter(i,decimal-leading-zero);
  font-family:var(--font-display);font-weight:800;font-size:var(--t3);
  color:var(--accent);min-width:106px;letter-spacing:.02em;
}
[data-toc="line"] .toc li{
  padding-bottom:20px;border-bottom:2px solid var(--hairline);
}
[data-toc="line"] .toc li:last-child{border-bottom:none;padding-bottom:0;}
[data-toc="dot"] .toc li::before{
  content:"";width:18px;height:18px;border-radius:50%;
  background:var(--accent);flex:none;transform:translateY(-8px);
}
[data-toc="card"] .toc{gap:16px;}
[data-toc="card"] .toc li{
  background:rgba(0,0,0,.04);border:2px solid var(--hairline);
  border-radius:calc(var(--radius) / 24 * 1);   /* 圆角气质跟随 --radius 但更收敛 */
  border-radius:min(var(--radius),24px);
  padding:22px 28px;
}

/* ══════════════════════════════════════════════════════════════════
   ⑤ 内容形态 B：大字 + 副标题介绍  <body data-layout="sub">
       对齐变体：data-align="left|center"
   ══════════════════════════════════════════════════════════════════ */
[data-layout="sub"] .title{font-size:calc(var(--t1) + 8px);}
[data-align="center"] .stage{align-items:center;text-align:center;}
[data-align="center"] .tag{align-self:center;}
[data-align="center"] .badge,[data-align="center"] .handle{text-align:center;}

/* 副标题上方的一条细规则线，很多品牌（Apple/Linear/Stripe）的典型分隔手法 */
.rule{flex:none;width:120px;height:6px;background:var(--accent);border-radius:999px;}
[data-align="center"] .rule{align-self:center;}

/* ══════════════════════════════════════════════════════════════════
   ⑥ 深色风格开关：<body data-mood="dark">（Linear / Vercel / Tesla / NVIDIA…）
      只是提示——真正的深色值仍应写进 :root TOKEN
   ══════════════════════════════════════════════════════════════════ */
[data-mood="dark"]{color:var(--ink);}
[data-mood="dark"] [data-toc="card"] .toc li{background:rgba(255,255,255,.05);}
</style>
</head>

<!--
  data-layout : toc（大字+短目录） | sub（大字+副标题）
  data-toc    : num | line | dot | card      仅 layout=toc 生效
  data-align  : left | center                仅 layout=sub 常用
  data-mood   : light | dark
-->
<body data-layout="sub" data-toc="num" data-align="center" data-mood="light">

  <div class="badge">效率手记 #08</div>

  <div class="stage">
    <div class="tag">效率工具</div>
    <h1 class="title">这五件事<br>我全交给 <em>AI</em></h1>
    <div class="rule"></div>
    <p class="sub">从选题到成图的完整配置清单<br>照着抄就能跑</p>
  </div>

  <div class="handle">@你的账号名</div>

  <!-- 形态 B 的结构（换用时替换 .stage 内部）：
       <div class="stage">
         <div class="tag">效率工具</div>
         <h1 class="title">这五件事<br>我全交给 <em>AI</em></h1>
         <div class="rule"></div>
         <p class="sub">从选题到成图的完整配置清单，照着抄就行</p>
       </div>
  -->
</body>
</html>
